[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squidveil"
version = "0.1.0"
description = "Official Python SDK for SquidVeil — the standalone secrets manager. Consumer-first: resolve secrets and VeilRefs with typed errors, retries, and TTL caching."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "SquidVeil" }]
keywords = ["secrets", "vault", "security", "veilref", "squidveil", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://squidcloud.vercel.app"
Documentation = "https://squidcloud.vercel.app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
squidveil = ["py.typed"]


appId: "com..SquidCloud"
productName: "SquidCloud"
copyright: "Copyright © 2025 "

directories:
  output: "release"
  buildResources: "electron/resources"

files:
  - "dist/**/*"
  - "electron/**/*"
  - "!electron/resources/*"
  - "!**/node_modules/*"
  - "!**/.vscode/*"
  - "!**/dist/assets/**/*.map"

extraResources:
  - from: "dist"
    to: "app/dist"
    filter:
      - "**/*"

win:
  target:
    - target: "nsis"
      arch: ["x64", "arm64"]
  icon: "electron/icons/icon.ico"
  publish: ["github"]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: "SquidCloud"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: "electron/icons/icon.ico"
  uninstallerIcon: "electron/icons/icon.ico"
  installerHeaderIcon: "electron/icons/icon.ico"
  menuCategory: "SquidCloud"
  displayLanguageSelector: true

mac:
  icon: "electron/icons/icon.icns"
  category: "public.app-category.productivity"
  target: 
    - "dmg"
    - "zip"

linux:
  icon: "electron/icons/icon.png"
  target:
    - target: "AppImage"
      arch: ["x64", "arm64", "ia32"]
    - target: "deb"
      arch: ["x64", "arm64", "ia32"]
  category: "Utility"

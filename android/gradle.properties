# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Prevent Gradle daemon crashes in low-memory CI/dev containers by disabling the daemon
# and capping memory and worker count. If you have a machine with more RAM, you can
# increase `-Xmx` and set `org.gradle.daemon=true`.
org.gradle.daemon=false
# JVM args: heap limit, produce heap dump on OOM, ensure UTF-8 file encoding
org.gradle.jvmargs=-Xmx1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Limit parallel workers to reduce memory pressure
org.gradle.workers.max=2

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# --- SquidCloud signing properties (example template) ------------------------
# Add your keystore values here for local builds. THESE MUST NOT BE COMMITTED
# Recommended: keep real secrets out of VCS and use environment variables or
# CI secrets instead. If you use this file locally, add it to .gitignore.
#
#SQUIDCLOUD_KEYSTORE_PATH=/full/path/to/squidcloud.keystore
#SQUIDCLOUD_STORE_PASSWORD=change_this_store_pass
#SQUIDCLOUD_KEY_ALIAS=squidcloud
#SQUIDCLOUD_KEY_PASSWORD=change_this_key_pass
#
# Example usage in android/app/build.gradle:
# signingConfigs {
#   squidcloudRelease {
#     storeFile file(project.property('SQUIDCLOUD_KEYSTORE_PATH'))
#     storePassword project.property('SQUIDCLOUD_STORE_PASSWORD')
#     keyAlias project.property('SQUIDCLOUD_KEY_ALIAS')
#     keyPassword project.property('SQUIDCLOUD_KEY_PASSWORD')
#   }
# }
#
# Quick build steps (copy these commands and run from project root):
# 1) Build web assets and copy wasm:
#    npm run copy:wasm
#    npm run build
# 2) Sync with Capacitor (ensure android platform added):
#    npx cap sync android
# 3) Build signed APK from Android Gradle wrapper:
#    cd android
#    # Option A: use environment variables (preferred)
#    SQUIDCLOUD_KEYSTORE_PATH="$(pwd)/app/squidcloud.keystore" \
#    SQUIDCLOUD_STORE_PASSWORD="your_storepass" \
#    SQUIDCLOUD_KEY_ALIAS="squidcloud" \
#    SQUIDCLOUD_KEY_PASSWORD="your_keypass" \
#    ./gradlew assembleRelease
#
#    # Option B: use local gradle.properties (if you set the values above)
#    ./gradlew assembleRelease
#
# 4) APK output:
#    android/app/build/outputs/apk/release/app-release.apk
#
# 5) To install on a connected device (adb required):
#    adb install -r android/app/build/outputs/apk/release/app-release.apk
# ---------------------------------------------------------------------------

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>readme — Markdown Reader</title>
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.11/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #ffffff; --surface: #f8f9fa; --border: #e5e7eb; --text: #1f2937; --muted: #6b7280; --accent: #2563eb; --accent-hover: #1d4ed8; --radius: 8px; --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Ubuntu,sans-serif; --mono: "SF Mono","Fira Code","Fira Mono","Roboto Mono",monospace; }
  [data-theme="dark"] { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --accent-hover: #79c0ff; }
  html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Header */
  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .spacer { flex: 1; }
  header button, header label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); cursor: pointer; transition: all .15s; white-space: nowrap; font-family: inherit; }
  header button:hover, header label:hover { border-color: var(--accent); color: var(--accent); }
  header input[type="file"] { display: none; }
  header input[type="url"] { flex: 0 1 300px; padding: 6px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); outline: none; min-width: 0; font-family: inherit; }
  header input[type="url"]:focus { border-color: var(--accent); }
  #load-url { font-size: 13px; }

  /* Tab bar */
  .tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; padding: 0 20px; }
  .tabs button { padding: 10px 16px; font-size: 13px; border: none; border-bottom: 2px solid transparent; background: none; color: var(--muted); cursor: pointer; font-family: inherit; transition: all .15s; }
  .tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:hover:not(.active) { color: var(--text); }

  /* Panels */
  .panels { flex: 1; display: flex; overflow: hidden; }
  .panels > div { flex: 1; display: none; overflow: auto; }
  .panels > div.active { display: block; }

  /* Editor textarea */
  #editor { width: 100%; height: 100%; padding: 24px; font-family: var(--mono); font-size: 14px; line-height: 1.7; border: none; outline: none; resize: none; background: var(--bg); color: var(--text); }
  #editor::placeholder { color: var(--muted); }

  /* Rendered output */
  #output { padding: 32px 48px; max-width: 900px; margin: 0 auto; line-height: 1.7; }
  #output h1, #output h2, #output h3, #output h4 { margin-top: 24px; margin-bottom: 12px; font-weight: 600; line-height: 1.3; }
  #output h1 { font-size: 2em; padding-bottom: 8px; border-bottom: 1px solid var(--border); } #output h2 { font-size: 1.5em; padding-bottom: 6px; border-bottom: 1px solid var(--border); } #output h3 { font-size: 1.25em; } #output h4 { font-size: 1em; }
  #output p, #output ul, #output ol, #output blockquote, #output table { margin-bottom: 16px; }
  #output a { color: var(--accent); text-decoration: none; } #output a:hover { text-decoration: underline; }
  #output code { font-family: var(--mono); font-size: .875em; padding: 2px 6px; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); }
  #output pre { margin-bottom: 16px; padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); overflow-x: auto; }
  #output pre code { padding: 0; border: none; background: none; }
  #output blockquote { padding: 0 16px; color: var(--muted); border-left: 4px solid var(--border); }
  #output img { max-width: 100%; border-radius: var(--radius); }
  #output table { width: 100%; border-collapse: collapse; }
  #output th, #output td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; }
  #output th { background: var(--surface); font-weight: 600; }
  #output tr:nth-child(even) { background: var(--surface); }
  #output ul, #output ol { padding-left: 24px; }
  #output li { margin-bottom: 4px; }
  #output hr { margin: 24px 0; border: none; border-top: 1px solid var(--border); }
  #output :first-child { margin-top: 0; }

  /* Status */
  #status { font-size: 12px; color: var(--muted); padding: 6px 20px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }

  /* Empty state */
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--muted); }
  .empty-state svg { opacity: .3; }
  .empty-state p { font-size: 14px; }
  .empty-state label { color: var(--accent); cursor: pointer; text-decoration: underline; }
  .empty-state label:hover { color: var(--accent-hover); }
</style>
</head>
<body>

<header>
  <h1>readme<span>.md</span></h1>
  <div class="spacer"></div>
  <input type="url" id="url-input" placeholder="Load from URL..." spellcheck="false" />
  <button id="load-url">Load</button>
  <label>Open File <input type="file" id="file-input" accept=".md,.markdown,.txt" /></label>
  <button id="theme-toggle">Theme</button>
</header>

<div class="tabs">
  <button class="active" data-tab="preview">Preview</button>
  <button data-tab="source">Source</button>
</div>

<div class="panels">
  <div id="preview-panel" class="active">
    <div class="empty-state" id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      <p>Open a <label onclick="document.getElementById('file-input').click()">.md file</label> or paste <label onclick="document.querySelector('[data-tab=source]').click()">source</label></p>
    </div>
    <div id="output" style="display:none"></div>
  </div>
  <div id="source-panel">
    <textarea id="editor" placeholder="Paste or edit markdown here..." spellcheck="false"></textarea>
  </div>
</div>

<div id="status">Ready</div>

<script>
const fileInput = document.getElementById('file-input');
const urlInput = document.getElementById('url-input');
const loadUrlBtn = document.getElementById('load-url');
const editor = document.getElementById('editor');
const output = document.getElementById('output');
const emptyState = document.getElementById('empty-state');
const statusEl = document.getElementById('status');
const themeToggle = document.getElementById('theme-toggle');

function setStatus(msg) { statusEl.textContent = msg; }

function render(md) {
  emptyState.style.display = 'none';
  output.style.display = 'block';
  output.innerHTML = marked.parse(md, { breaks: true, gfm: true });
  output.querySelectorAll('pre code').forEach(b => {
    b.addEventListener('dblclick', () => {
      navigator.clipboard.writeText(b.textContent).then(() => setStatus('Copied code block')).catch(() => {});
    });
  });
  setStatus(`${md.split('\n').length} lines · ${md.length} chars`);
}

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { editor.value = reader.result; render(reader.result); };
  reader.readAsText(file);
  setStatus(`Loaded ${file.name}`);
});

async function loadFromUrl(url) {
  try {
    setStatus('Fetching...');
    const res = await fetch(url);
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const text = await res.text();
    editor.value = text;
    render(text);
    setStatus(`Loaded ${url.split('/').pop()}`);
  } catch (err) {
    setStatus(`Error: ${err.message}`);
  }
}

loadUrlBtn.addEventListener('click', () => {
  const url = urlInput.value.trim();
  if (!url) return;
  urlInput.value = url;
  loadFromUrl(url);
});

urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadUrlBtn.click(); });

editor.addEventListener('input', () => {
  const text = editor.value.trim();
  if (!text) { emptyState.style.display = 'flex'; output.style.display = 'none'; setStatus('Ready'); return; }
  render(text);
});

// Tabs
document.querySelectorAll('[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panels > div').forEach(p => p.classList.remove('active'));
    document.getElementById(btn.dataset.tab + '-panel').classList.add('active');
    if (btn.dataset.tab === 'preview' && editor.value.trim()) render(editor.value);
  });
});

// Theme
themeToggle.addEventListener('click', () => {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  themeToggle.textContent = isDark ? 'Light' : 'Dark';
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'o') { e.preventDefault(); fileInput.click(); }
  if (e.key === 'Escape') { editor.value = ''; emptyState.style.display = 'flex'; output.style.display = 'none'; setStatus('Cleared'); }
});
</script>
</body>
</html>
